<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <title>악보 암기</title>
  <meta name="description" content="내 MusicXML 악보를 올려 마디 퍼즐, 악절 순서, 음표 빈칸, 악상 퀴즈로 외우는 연습 앱">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#library">악보 암기</a>
    <button id="piece-btn" class="piece-btn" type="button" aria-label="보관함 열기">
      <span id="piece-title">악보를 추가하세요</span>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <nav id="nav" aria-label="주 메뉴">
      <button data-tab="practice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>연습</span></button>
      <button data-tab="view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span>악보</span></button>
      <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5"/></svg><span>진도</span></button>
      <button data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 012-2h4l2 2h7a2 2 0 012 2v7a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg><span>보관함</span></button>
    </nav>
    <button id="add-btn" class="btn ghost add-btn" type="button">악보 추가</button>
    <input id="add-file" type="file" accept=".musicxml,.xml,.mxl" multiple hidden>
  </header>
  <main id="main"></main>
  <footer class="foot">
    <p id="score-note"></p>
    <p>악보 표시 <a href="https://www.verovio.org/">Verovio</a> (LGPL-3.0). 올린 악보와 진도는 서버로 전송되지 않고 이 기기의 브라우저에만 저장됩니다.</p>
  </footer>
  <div id="drop-overlay" class="drop-overlay" hidden><div>MusicXML 파일을 여기에 놓으세요</div></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="vendor/verovio/verovio-toolkit-wasm.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
